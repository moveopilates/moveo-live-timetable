<style>
* { box-sizing: border-box; }
body {
margin: 0;
background: #fff;
color: #222;
font-family: Arial, Helvetica, sans-serif;
}
.wrapper {
width: 100%;
max-width: 1100px;
margin: 0 auto;
padding: 6px 4px 28px;
}
.brand { text-align:center; margin:0; line-height:0; }
.logo { width:130px; height:auto; border-radius:8px; display:inline-block; }
h1 {
text-align:center; margin:7px 0 2px; font-size:30px; line-height:1.05; font-weight:700;
}
.subtitle {
text-align:center; font-size:15px; color:#555; margin-bottom:6px;
}
.legend {
display:flex; justify-content:center; align-items:center; gap:12px;
margin-bottom:10px; font-size:13px; color:#444; white-space:nowrap;
}
.dot {
display:inline-block; width:18px; height:18px; border-radius:50%;
margin-right:5px; flex-shrink:0;
}
.green { background:#4fa866; }
.orange { background:#e99032; }

.week {
width:100%;
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:3px;
}
.day {
min-width:0; overflow:hidden; background:#fff;
border:1px solid #dce2df; border-radius:9px;
}
.day-title {
padding:11px 1px; background:#dcebea; color:#244653;
text-align:center; font-size:15px; font-weight:800;
}
.class-card {
min-height:104px; padding:12px 5px;
border-top:1px solid #e7e7e7; background:#fff; overflow:hidden;
}
.class-card.available { cursor:pointer; }
.class-card.available:active { background:#f2f8f5; }
.time-row {
display:flex; align-items:flex-start; font-size:16px;
line-height:1.1; font-weight:700; white-space:normal;
}
.class-name {
margin-top:6px; font-size:14.5px; line-height:1.18; font-weight:500;
}
.teacher {
margin-top:6px; font-size:12.5px; line-height:1.1; color:#555; font-weight:500;
}
.contact-note {
text-align:center; margin-top:10px; font-size:11px; color:#777;
}

.action-buttons {
display:flex; justify-content:center; gap:10px;
margin:14px auto 8px; padding:0 8px; max-width:500px;
}
.action-button {
flex:1; display:flex; align-items:center; justify-content:center;
min-height:48px; padding:10px 12px; border-radius:10px;
text-decoration:none; font-size:14px; font-weight:700; text-align:center;
}
.enquiry-button {
background:#dcebea; color:#244653; border:1px solid #cbdedc;
}
.instagram-button {
background:#fff; color:#244653; border:1px solid #9fb9b7;
}

.teachers-section {
max-width:520px; margin:24px auto 0; padding:0 8px;
}
.teachers-title {
text-align:center; font-size:22px; font-weight:700;
color:#244653; margin-bottom:16px;
}
.teacher-grid {
display:grid; grid-template-columns:1fr 1fr; gap:18px;
}
.teacher-profile {
text-align:center; padding:8px;
}
.headshot {
width:110px; height:110px; border-radius:50%;
object-fit:cover; display:block; margin:0 auto 10px;
border:4px solid #dcebea; background:#f2f2f2;
}
.teacher-name {
font-size:19px; font-weight:700; color:#244653; margin-bottom:5px;
}
.teacher-classes {
font-size:12.5px; line-height:1.4; color:#555;
}

@media (min-width:700px) {
.logo { width:165px; }
h1 { font-size:32px; }
.day-title { font-size:16px; }
.time-row { font-size:17px; }
.class-name { font-size:15px; }
.teacher { font-size:13px; }
}
@media (max-width:600px) {
.action-buttons { gap:7px; }
.action-button { min-height:46px; font-size:13px; padding:9px 7px; }
.teachers-section { margin-top:22px; }
.teachers-title { font-size:19px; }
.teacher-grid { gap:10px; }
.headshot { width:92px; height:92px; }
.teacher-name { font-size:17px; }
.teacher-classes { font-size:11.5px; }
}
</style>
</head>

<script>
const contacts = {
"Caz": "61422715359",
"Janet": "61418308057"
};

const days = ["Monday","Tuesday","Wednesday","Thursday","Friday"];

google.script.run
.withSuccessHandler(buildTimetable)
.getTimetable();

function buildTimetable(data) {
const week = document.getElementById("week");
week.innerHTML = "";

days.forEach(dayName => {
const column = document.createElement("div");
column.className = "day";

const heading = document.createElement("div");
heading.className = "day-title";
heading.textContent = dayName;
column.appendChild(heading);

const classes = data.filter(item =>
item.day.trim().toLowerCase() === dayName.toLowerCase()
);

classes.forEach(item => {
const card = document.createElement("div");
card.className = "class-card";

const status = item.status.trim().toLowerCase();
if (status === "available" || status === "1 space") {
card.classList.add("available");
}

const timeRow = document.createElement("div");
timeRow.className = "time-row";

if (status === "available") {
const dot = document.createElement("span");
dot.className = "dot green";
timeRow.appendChild(dot);
}
if (status === "1 space") {
const dot = document.createElement("span");
dot.className = "dot orange";
timeRow.appendChild(dot);
}

const time = document.createElement("span");
time.textContent = item.time;
timeRow.appendChild(time);

const className = document.createElement("div");
className.className = "class-name";
className.textContent = item.className;

const teacher = document.createElement("div");
teacher.className = "teacher";
teacher.textContent = item.teacher;

card.appendChild(timeRow);
card.appendChild(className);
card.appendChild(teacher);

if (status === "available" || status === "1 space") {
const number = contacts[item.teacher];
if (number) {
card.addEventListener("click", function() {
const message =
"Hi " + item.teacher +
", I’m interested in the " +
item.day + " " +
item.time + " " +
item.className +
" class. Is the space still available?";

const whatsappURL =
"https://wa.me/" + number +
"?text=" + encodeURIComponent(message);

window.open(whatsappURL, "_top");
});
}
}

column.appendChild(card);
});

week.appendChild(column);
});
}
</script>
